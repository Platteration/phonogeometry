name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - run: npm test

      - run: npm run test:conventions

      # The app has no dependencies and no lockfile, so Playwright is pinned here and
      # installed after the unit suite has run on the bare checkout, without touching
      # package.json. --ignore-scripts so that no install script runs: 1.64.0's tree has none
      # (playwright and playwright-core, no optional dependency), and one a later pin brings in
      # is not a decision to delegate. 1.61.0 is the first release with a Chromium build for
      # Ubuntu 26.04, which ubuntu-latest becomes from 2026-10-19: on an older one the install
      # below fails there (test/ci.test.js holds the pin to it).
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.0

      - run: npx playwright install --with-deps chromium

      # REQUIRE_BROWSER makes a missing browser a failure: the suite skips itself by design
      # when run on a bare checkout, which would otherwise make this job pass without testing.
      - name: End to end in Chromium
        run: npm run test:e2e
        env:
          REQUIRE_BROWSER: '1'

  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # The checksums in the tree only prove the note and the vendored files agree with each
      # other, which a backdoored copy plus an edited note also manages. This compares the
      # bytes with the signed package on the registry, so it needs the network and cannot be
      # part of `npm test`.
      - run: npm run verify:vendor
