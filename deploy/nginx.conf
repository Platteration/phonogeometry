# Phonogeometry: nginx server blocks. Include this file from the http {} block (for example
# from /etc/nginx/conf.d/), then set server_name, root and the certificate paths. Netlify and
# Cloudflare Pages read _headers instead; Apache: .htaccess. The headers are the same in all
# three and in the pages' <meta>, and test/website.test.js holds them equal.

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  server_tokens off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;

  # The folder `node tools/site.js /var/www/phonogeometry` writes: the site and nothing else.
  # Never point root at a git checkout; the allowlist below is the second line.
  root /var/www/phonogeometry;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  server_tokens off;
  autoindex off;
  charset utf-8;

  # a missing page, a folder and a refused file all show the site's own not-found page
  error_page 403 404 =404 /404.html;

  # The site's own files and nothing else: the repository's notes, tests, tools, dev server and
  # configs, dotfiles (.git and .certs above all) and node_modules all answer 404.
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|404\.html|sw\.js|manifest\.webmanifest|styles\.css|robots\.txt|\.well-known/security\.txt|icons/icon-(192|512)\.png|src/((camera|mesh|pipeline|viewer|vision)/)?[A-Za-z]+\.js|vendor/three/(three\.module\.min\.js|OrbitControls\.js|LICENSE))$ {
    try_files $uri =404;
  }
  location / {
    return 404;
  }
  # three.js's licence has no extension, and an older mime.types has no webmanifest
  location = /vendor/three/LICENSE {
    default_type text/plain;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-YZsq6qJLsf/5TaskaAzwZ3b+Wi32EerrwGMOBDVEtUc='; style-src 'self' 'sha256-k6jth54MHrYRc0rvI2w7ZQMS6jqHLr0Lm9hZLmXtrCE='; img-src 'self' data:; worker-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types phonogeometry; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(self), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(self), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # no file name carries a version: revalidate every load (an unchanged file is a 304)
  add_header Cache-Control "no-cache" always;
}
